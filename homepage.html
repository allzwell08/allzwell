<html lang="en">
<head>

<link rel="stylesheet" href="homepage.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<title>Home | All'zWell</title>

<!-- Small additions for the profile icon + logout button in the header.
     These are new class names, so they won't collide with anything
     already in homepage.css. Feel free to move these rules into
     homepage.css instead if you'd rather keep styles in one place. -->
<style>
  #buttoncontainer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-right-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #home-profile-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sage, #6E9B85) 0%, var(--dusk, #8C86B4) 100%);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
  }
  #home-logout-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.06);
    border: none;
    color: inherit;
    font-size: 16px;
    cursor: pointer;
  }
  #home-logout-btn:hover,
  #home-profile-link:hover {
    filter: brightness(0.95);
  }
</style>
</head>
<body>
<div class="placeholder">

<div id="buttoncontainer">
<button class="backbutton" onclick="goBack()" aria-label="Go back"><i class="fa-solid fa-circle-left"></i></button>

<div class="header-right-actions">
<a id="home-profile-link" href="profile.html" aria-label="Your profile">?</a>
<button id="home-logout-btn" type="button" aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
</div>
</div>

<div class="container">
<h1 class="title" id="greeting">Hello,</h1>
<h1 class="subtitle" id="appname">Welcome To All'z Well</h1>
</div>

<a href="breathingexericise.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--sage);"><img src="timer-48.png" alt=""></div><div class="option-text">Calm Yourself Down With Breathing Exercises</div></div></a>
<a href="journal.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--dusk);"><img src="book-48.png" alt=""></div><div class="option-text">Record Your Thoughts</div></div></a>
<a href="music (1).html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--gold-deep);"><img src="note-48.png" alt=""></div><div class="option-text">Listen To Binaural Beats</div></div></a>
<a href="motivation.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--sage-deep);"><img src="quote-48.png" alt=""></div><div class="option-text">Read Motivational Quotes</div></div></a>
<a href="game.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--dusk-deep);"><img src="user-48.png" alt="" width="50px"></div><div class="option-text">Self-care</div></div></a>
<a href="awareness.htm"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--sage);"><img src="conference-call-48.png " alt="" width="50px"></div><div class="option-text">We are here for you</div></div></a>
<a href="affirmations.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--dusk);"><img src="speech-bubble-2-48 (1).png" alt="" width="50px"></div><div class="option-text">Read some positive messages</div></div></a>
<a href="links.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--gold-deep);"><img src="link-2-48.png" alt="" width="50px"></div><div class="option-text">Additional Links</div></div></a>
<a href="contactus.html"><div class="optioncontainer"><div class="option-icon" style="background-color: var(--sage-deep);"><img src="phone-48.png" alt="" width="50px"></div><div class="option-text">Your aren't alone</div></div></a>

</div>
<script>
function goBack() {
window.history.back();
}

// -- Firebase setup (same project as login.html) -----------------------
const firebaseConfig = {
  apiKey: "AIzaSyBG2WN4k3Me877QTwc65wUMd-0AyrT55Cg",
  authDomain: "allzwell-af788.firebaseapp.com",
  databaseURL: "https://allzwell-af788-default-rtdb.firebaseio.com",
  projectId: "allzwell-af788",
  storageBucket: "allzwell-af788.firebasestorage.app",
  messagingSenderId: "472403085872",
  appId: "1:472403085872:web:3ea0616bad417ae0d2bbf5",
  measurementId: "G-FS2TKGZVWE"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.database();

function initials(text) {
  if (!text) return "?";
  const clean = text.trim();
  const parts = clean.split(/[\s._-]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return clean.slice(0, 2).toUpperCase();
}

// Show the signed-in user's saved display name as the greeting (falling
// back to the email prefix if they haven't set one yet on profile.html).
// If nobody is signed in, send them back to the login page rather than
// showing a blank/fake greeting.
auth.onAuthStateChanged((user) => {
  const greeting = document.getElementById("greeting");
  const profileLink = document.getElementById("home-profile-link");

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const fallbackName = user.email.split("@")[0];
  greeting.textContent = "Hello " + fallbackName + ",";
  profileLink.textContent = initials(fallbackName);

  db.ref("Loginform/" + user.uid + "/displayName").once("value")
    .then((snap) => {
      const displayName = snap.val();
      if (displayName) {
        greeting.textContent = "Hello " + displayName + ",";
        profileLink.textContent = initials(displayName);
        profileLink.setAttribute("aria-label", displayName + "'s profile");
      }
    })
    .catch((err) => console.error("homepage: could not load displayName", err));
});

// -- Logout -------------------------------------------------------------
document.getElementById("home-logout-btn").addEventListener("click", () => {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
});
</script>
</body>
</html>
