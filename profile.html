<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile | All'zWell</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<link rel="stylesheet" href="navbar.css">

<!-- Firebase (compat build) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@400;500;600;700&display=swap");

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, var(--sand-deep) 0%, var(--sand) 65%);
    color: var(--ink);
  }

  main.profile-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .profile-avatar-large {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sage) 0%, var(--dusk) 100%);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 600;
    flex-shrink: 0;
  }

  .profile-header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
  }

  .profile-header p {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-top: 2px;
  }

  .profile-card {
    background: var(--cream);
    border-radius: 20px;
    box-shadow: 0 16px 40px rgba(46, 43, 38, 0.12);
    padding: 26px 24px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--sand-deep);
    background: #fff;
    color: var(--ink);
    font-size: 15px;
    font-family: var(--font-body);
    resize: vertical;
  }

  .field input:disabled {
    background: var(--cream-dim);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: var(--gold-deep);
    box-shadow: inset 0 0 0 2px rgba(216, 178, 124, 0.25);
  }

  .field-hint {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .avatar-swatches {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .avatar-swatch {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
  }

  .avatar-swatch.selected {
    border-color: var(--ink);
  }

  .save-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
  }

  #save-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 16px rgba(46, 43, 38, 0.15);
  }

  #save-btn:hover {
    background: var(--gold-deep);
    transform: translateY(-2px);
  }

  #save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .continue-link {
    color: var(--dusk-deep);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
  }

  .continue-link:hover {
    text-decoration: underline;
  }

  .profile-message {
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
  }

  .profile-message.success { color: var(--sage-deep); }
  .profile-message.error { color: #B5652D; }

  .sign-out-row {
    text-align: center;
    margin-top: 22px;
  }

  .sign-out-row button {
    background: none;
    border: none;
    color: var(--dusk-deep);
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<main class="profile-page">
  <div class="profile-header">
    <div class="profile-avatar-large" id="profile-avatar-large">?</div>
    <div>
      <h1 id="profile-heading">Your Profile</h1>
      <p id="profile-email-display">&nbsp;</p>
    </div>
  </div>

  <div class="profile-card">
    <form id="profile-form">
      <div class="field">
        <label for="displayName">Display name</label>
        <input id="displayName" type="text" maxlength="40" placeholder="What should we call you?">
        <p class="field-hint">Shown in your greeting and around the app. Not shared with anyone else.</p>
      </div>

      <div class="field">
        <label for="about">A little about you</label>
        <textarea id="about" rows="3" maxlength="240" placeholder="Optional -- anything you'd like to note for yourself."></textarea>
      </div>

      <div class="field">
        <label>Avatar color</label>
        <div class="avatar-swatches" id="avatar-swatches">
          <div class="avatar-swatch" data-color="sage" style="background: var(--sage);"></div>
          <div class="avatar-swatch" data-color="dusk" style="background: var(--dusk);"></div>
          <div class="avatar-swatch" data-color="gold" style="background: var(--gold);"></div>
          <div class="avatar-swatch" data-color="sage-deep" style="background: var(--sage-deep);"></div>
          <div class="avatar-swatch" data-color="dusk-deep" style="background: var(--dusk-deep);"></div>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="text" disabled>
        <p class="field-hint">Contact support to change the email on your account.</p>
      </div>

      <div class="save-row">
        <button type="submit" id="save-btn">Save changes</button>
        <a href="homepage.html" id="continue-btn" class="continue-link">Continue to app &rarr;</a>
        <p class="profile-message" id="profile-message"></p>
      </div>
    </form>
  </div>

  <div class="sign-out-row">
    <button id="sign-out-btn" type="button">Sign out</button>
  </div>
</main>

<script src="navbar.js" defer></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBG2WN4k3Me877QTwc65wUMd-0AyrT55Cg",
    authDomain: "allzwell-af788.firebaseapp.com",
    databaseURL: "https://allzwell-af788-default-rtdb.firebaseio.com",
    projectId: "allzwell-af788",
    storageBucket: "allzwell-af788.firebasestorage.app",
    messagingSenderId: "472403085872",
    appId: "1:472403085872:web:3ea0616bad417ae0d2bbf5",
    measurementId: "G-FS2TKGZVWE"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.database();

  const COLOR_MAP = {
    sage: "linear-gradient(135deg, var(--sage) 0%, var(--sage-deep) 100%)",
    dusk: "linear-gradient(135deg, var(--dusk) 0%, var(--dusk-deep) 100%)",
    gold: "linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%)",
    "sage-deep": "linear-gradient(135deg, var(--sage-deep) 0%, var(--ink) 100%)",
    "dusk-deep": "linear-gradient(135deg, var(--dusk-deep) 0%, var(--ink) 100%)"
  };

  const displayNameInput = document.getElementById("displayName");
  const aboutInput = document.getElementById("about");
  const emailInput = document.getElementById("email");
  const avatarLarge = document.getElementById("profile-avatar-large");
  const emailDisplay = document.getElementById("profile-email-display");
  const heading = document.getElementById("profile-heading");
  const swatches = document.querySelectorAll(".avatar-swatch");
  const form = document.getElementById("profile-form");
  const saveBtn = document.getElementById("save-btn");
  const messageEl = document.getElementById("profile-message");
  const signOutBtn = document.getElementById("sign-out-btn");

  let selectedColor = "sage";
  let currentUid = null;

  function initials(text) {
    if (!text) return "?";
    const clean = text.trim();
    const parts = clean.split(/[\s._-]+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return clean.slice(0, 2).toUpperCase();
  }

  function applyAvatarColor(color) {
    selectedColor = color;
    avatarLarge.style.background = COLOR_MAP[color] || COLOR_MAP.sage;
    swatches.forEach((s) => s.classList.toggle("selected", s.dataset.color === color));
  }

  swatches.forEach((s) => {
    s.addEventListener("click", () => applyAvatarColor(s.dataset.color));
  });

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "profile-message " + type;
  }

  auth.onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    currentUid = user.uid;
    emailInput.value = user.email;
    emailDisplay.textContent = user.email;

    db.ref("Loginform/" + user.uid).once("value")
      .then((snap) => {
        const data = snap.val() || {};
        displayNameInput.value = data.displayName || "";
        aboutInput.value = data.about || "";
        applyAvatarColor(data.avatarColor || "sage");

        const nameForInitials = data.displayName || user.email.split("@")[0];
        avatarLarge.textContent = initials(nameForInitials);
        heading.textContent = data.displayName ? data.displayName : "Your Profile";

        displayNameInput.addEventListener("input", () => {
          avatarLarge.textContent = initials(displayNameInput.value || user.email.split("@")[0]);
        });
      })
      .catch((err) => {
        console.error("profile: could not load data", err);
        showMessage("Couldn't load your profile. Please refresh.", "error");
      });
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!currentUid) return;

    saveBtn.disabled = true;
    showMessage("Saving...", "success");

    // .update() merges fields -- email/createdAt/lastLogin written
    // elsewhere (login.html) are left untouched.
    db.ref("Loginform/" + currentUid).update({
      displayName: displayNameInput.value.trim(),
      about: aboutInput.value.trim(),
      avatarColor: selectedColor,
      profileUpdatedAt: new Date().toISOString()
    })
      .then(() => {
        showMessage("Saved!", "success");
        heading.textContent = displayNameInput.value.trim() || "Your Profile";
      })
      .catch((err) => {
        console.error("profile: save failed", err);
        showMessage("Couldn't save your changes. Please try again.", "error");
      })
      .finally(() => {
        saveBtn.disabled = false;
      });
  });

  signOutBtn.addEventListener("click", () => {
    auth.signOut().then(() => {
      window.location.href = "login.html";
    });
  });
</script>
</body>
</html>
