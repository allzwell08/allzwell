    <script>
      // Lazy-load YouTube embeds: swap the lightweight thumbnail for the
      // real iframe only when someone actually wants to watch. This is the
      // single biggest win for page load time — 6 live YouTube players
      // loading up front is what was slowing the page down.
      document.querySelectorAll(".video-facade").forEach(function (facade) {
        function loadVideo() {
          var id = facade.getAttribute("data-video-id");
          var iframe = document.createElement("iframe");
          iframe.className = "video";
          iframe.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
          iframe.title = facade.getAttribute("aria-label");
          iframe.frameBorder = "0";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          facade.replaceWith(iframe);
        }
        facade.addEventListener("click", loadVideo);
        facade.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            loadVideo();
          }
        });
      });
    </script>
